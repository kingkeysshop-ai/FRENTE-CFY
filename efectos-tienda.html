<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Efectos - Tienda</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    overflow: hidden;
    background: #1a1a2e;
  }
  canvas.bg-effect {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    pointer-events: none;
  }
  .card {
    text-align: center;
    padding: 2.5rem;
    background: rgba(0,0,0,0.35);
    border-radius: 1.2rem;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
  p { opacity: 0.8; margin-bottom: 1.5rem; }
  button {
    padding: 0.7rem 2rem;
    font-size: 1rem;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-radius: 2rem;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { background: rgba(255,255,255,0.18); }
  .badge {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.3rem 1rem;
    border-radius: 1rem;
    background: rgba(255,255,255,0.1);
    font-size: 0.85rem;
    opacity: 0.7;
  }
</style>
</head>
<body>

<canvas id="bg-canvas" class="bg-effect"></canvas>

<div class="card">
  <h1>✨ Tu Tienda ✨</h1>
  <p>Efecto ambiental inspirado en Odysseus</p>
  <button onclick="location.reload()">Cambiar efecto</button>
  <div class="badge" id="effect-name">—</div>
</div>

<script>
// ===== EFECTOS EXTRAÍDOS DE ODYSSEUS =====

const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
}

// ── 1. Synapse — pulsos en una cuadrícula invisible ──
function initSynapse() {
  const GRID = 24, MAX_PULSES = 20, TRAIL_LEN = 12;
  const COLOR = '#7ec8e3';
  let cols, rows, pulses = [], animId;

  function getColsRows() {
    cols = Math.ceil(W / GRID);
    rows = Math.ceil(H / GRID);
  }
  getColsRows();
  window.addEventListener('resize', getColsRows);

  function spawnPulse() {
    const speed = 2 + Math.random() * 20;
    if (Math.random() > 0.5) {
      const row = Math.floor(Math.random() * (rows + 1));
      pulses.push({ x: -TRAIL_LEN, y: row * GRID, dx: speed, dy: 0 });
    } else {
      const col = Math.floor(Math.random() * (cols + 1));
      pulses.push({ x: col * GRID, y: -TRAIL_LEN, dx: 0, dy: speed });
    }
  }

  function draw() {
    animId = requestAnimationFrame(draw);
    ctx.clearRect(0, 0, W, H);
    const c = COLOR;
    if (pulses.length < MAX_PULSES && Math.random() < 0.12) spawnPulse();
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      p.x += p.dx; p.y += p.dy;
      if (p.x > W + TRAIL_LEN || p.y > H + TRAIL_LEN) { pulses.splice(i, 1); continue; }
      const tx = p.x - (p.dx > 0 ? TRAIL_LEN : 0);
      const ty = p.y - (p.dy > 0 ? TRAIL_LEN : 0);
      const grad = ctx.createLinearGradient(tx, ty, p.x, p.y);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(1, c);
      ctx.strokeStyle = grad;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  draw();
  return () => cancelAnimationFrame(animId);
}

// ── 2. Rain — delgadas líneas cayendo ──
function initRain() {
  const MAX_DROPS = 130, drops = [];
  const COLOR = '#7ec8e3';
  let animId;

  function spawn() {
    drops.push({
      x: Math.random() * W, y: -(20 + Math.random() * 40),
      len: 20 + Math.random() * 40, speed: 4 + Math.random() * 8,
      alpha: 0.32 + Math.random() * 0.28
    });
  }

  function draw() {
    animId = requestAnimationFrame(draw);
    ctx.clearRect(0, 0, W, H);
    const c = COLOR;
    if (drops.length < MAX_DROPS && Math.random() < 0.6) spawn();
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.y += d.speed;
      if (d.y > H + d.len) { drops.splice(i, 1); continue; }
      const grad = ctx.createLinearGradient(d.x, d.y - d.len, d.x, d.y);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(1, c);
      ctx.strokeStyle = grad;
      ctx.globalAlpha = d.alpha;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y - d.len);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  draw();
  return () => cancelAnimationFrame(animId);
}

// ── 3. Constellations — estrellas conectadas por líneas ──
function initConstellations() {
  const STAR_COUNT = 50, CONNECT_DIST = 120;
  const COLOR = '#7ec8e3';
  let stars = [], t = 0, animId;

  function initStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15,
        r: 0.8 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2
      });
    }
  }
  initStars();
  const reinit = () => { resize(); initStars(); };
  window.addEventListener('resize', reinit);

  function draw() {
    animId = requestAnimationFrame(draw);
    t += 0.01;
    ctx.clearRect(0, 0, W, H);
    const c = COLOR;
    for (const s of stars) {
      s.x += s.vx; s.y += s.vy;
      if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
      if (s.y < 0) s.y = H; if (s.y > H) s.y = 0;
    }
    ctx.strokeStyle = c;
    ctx.lineWidth = 0.5;
    for (let i = 0; i < stars.length; i++) {
      for (let j = i + 1; j < stars.length; j++) {
        const dx = stars[i].x - stars[j].x;
        const dy = stars[i].y - stars[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECT_DIST) {
          ctx.globalAlpha = (1 - dist / CONNECT_DIST) * 0.15;
          ctx.beginPath();
          ctx.moveTo(stars[i].x, stars[i].y);
          ctx.lineTo(stars[j].x, stars[j].y);
          ctx.stroke();
        }
      }
    }
    ctx.fillStyle = c;
    for (const s of stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(t * 2 + s.phase);
      ctx.globalAlpha = 0.15 + twinkle * 0.25;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  draw();
  return () => cancelAnimationFrame(animId);
}

// ── 4. Perlin Flow — partículas fluyendo ──
function initPerlinFlow() {
  const particles = [];
  const COLOR = '#7ec8e3';
  let t = 0, animId;

  function noise2d(x, y) {
    const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return n - Math.floor(n);
  }
  function smoothNoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const a = noise2d(ix, iy), b = noise2d(ix + 1, iy), cc = noise2d(ix, iy + 1), d = noise2d(ix + 1, iy + 1);
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * ux + (cc - a) * uy + (a - b - cc + d) * ux * uy;
  }

  for (let i = 0; i < 200; i++) particles.push({ x: Math.random() * W, y: Math.random() * H, life: Math.random() });

  function draw() {
    animId = requestAnimationFrame(draw);
    ctx.fillStyle = 'rgba(26,26,46,0.04)';
    ctx.fillRect(0, 0, W, H);
    const c = COLOR;
    for (const p of particles) {
      const n = smoothNoise(p.x * 0.004 + t * 0.0008, p.y * 0.004 + 100);
      const angle = n * Math.PI * 6;
      const speed = 1 + smoothNoise(p.x * 0.003, p.y * 0.003 + 50) * 1.5;
      p.x += Math.cos(angle) * speed; p.y += Math.sin(angle) * speed;
      p.life -= 0.001;
      if (p.life <= 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
        p.x = Math.random() * W; p.y = Math.random() * H; p.life = 1;
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI * 2);
      ctx.fillStyle = c; ctx.globalAlpha = p.life * 0.15; ctx.fill();
    }
    ctx.globalAlpha = 1;
    t++;
  }
  draw();
  return () => cancelAnimationFrame(animId);
}

// ── 5. Petals — pétalos cayendo ──
function initPetals() {
  const petals = [];
  const COLOR = '#f5a0c0';
  let animId;

  function makePetal() {
    return {
      x: Math.random() * W, y: -10 - Math.random() * 40,
      size: 3 + Math.random() * 5, rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.03, vy: 0.3 + Math.random() * 0.6,
      drift: Math.random() * Math.PI * 2, driftSpeed: 0.008 + Math.random() * 0.012,
      wobble: 0.3 + Math.random() * 0.8
    };
  }
  for (let i = 0; i < 30; i++) { const p = makePetal(); p.y = Math.random() * H; petals.push(p); }

  function draw() {
    animId = requestAnimationFrame(draw);
    ctx.clearRect(0, 0, W, H);
    const c = COLOR;
    for (const p of petals) {
      p.y += p.vy; p.rot += p.vr; p.drift += p.driftSpeed;
      p.x += Math.sin(p.drift) * p.wobble;
      if (p.y > H + 15) Object.assign(p, makePetal());
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(-p.size * 0.2, 0, p.size * 0.6, p.size * 0.3, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.15;
      ctx.beginPath(); ctx.ellipse(p.size * 0.2, 0, p.size * 0.6, p.size * 0.3, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  draw();
  return () => cancelAnimationFrame(animId);
}

// ── 6. Sparkles — estrellas titilantes ──
function initSparkles() {
  const sparkles = [];
  const COLOR = '#ffd700';
  let animId;

  function makeSpark() {
    return { x: Math.random() * W, y: Math.random() * H, size: 2 + Math.random() * 5, phase: Math.random() * Math.PI * 2, speed: 0.015 + Math.random() * 0.03, life: 0.5 + Math.random() * 0.5 };
  }
  for (let i = 0; i < 35; i++) sparkles.push(makeSpark());

  function drawStar(x, y, r, c, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = c; ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.15, -r * 0.15, r, 0);
    ctx.quadraticCurveTo(r * 0.15, r * 0.15, 0, r);
    ctx.quadraticCurveTo(-r * 0.15, r * 0.15, -r, 0);
    ctx.quadraticCurveTo(-r * 0.15, -r * 0.15, 0, -r);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    animId = requestAnimationFrame(draw);
    ctx.clearRect(0, 0, W, H);
    const c = COLOR;
    for (const s of sparkles) {
      s.phase += s.speed;
      const twinkle = Math.sin(s.phase);
      const alpha = Math.max(0, twinkle) * 0.25 * s.life;
      const scale = 0.5 + Math.max(0, twinkle) * 0.5;
      if (alpha > 0.01) drawStar(s.x, s.y, s.size * scale, c, alpha);
      if (s.phase > Math.PI * 6) Object.assign(s, makeSpark());
    }
    ctx.globalAlpha = 1;
  }
  draw();
  return () => cancelAnimationFrame(animId);
}

// ── 7. Embers — brasas ascendentes ──
function initEmbers() {
  const embers = [];
  const COLOR = '#c9a95a';
  let animId;

  function makeEmber() {
    return {
      x: Math.random() * W, y: H + Math.random() * 40,
      vx: (Math.random() - 0.5) * 0.3, vy: -0.3 - Math.random() * 0.8,
      r: 0.3 + Math.random() * 0.6, life: 0, maxLife: 220 + Math.random() * 220,
      wobble: Math.random() * Math.PI * 2, spark: false
    };
  }
  for (let i = 0; i < 60; i++) { const e = makeEmber(); e.y = Math.random() * H; e.life = Math.random() * e.maxLife; embers.push(e); }

  function rgba(hex, a) {
    const { r, g, b } = hexToRgb(hex) || { r: 0, g: 0, b: 0 };
    return `rgba(${r},${g},${b},${a})`;
  }

  function draw() {
    animId = requestAnimationFrame(draw);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const color = COLOR;
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.wobble += 0.03;
      e.x += e.vx + Math.sin(e.wobble) * 0.5;
      e.y += e.vy;
      e.life++;
      if (e.life > e.maxLife || e.y < -20) {
        embers.splice(i, 1);
        if (embers.length < 70) embers.push(makeEmber());
        continue;
      }
      if (!e.spark && Math.random() < 0.003) e.spark = true;
      const lifeRatio = e.life / e.maxLife;
      const fade = Math.min(1, Math.min(lifeRatio * 4, (1 - lifeRatio) * 3));
      const r = e.r * (e.spark ? 2.4 : 1);
      const a = (e.spark ? 0.9 : 0.55) * fade;
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r * 4);
      g.addColorStop(0, rgba(color, a));
      g.addColorStop(0.4, rgba(color, a * 0.3));
      g.addColorStop(1, rgba(color, 0));
      ctx.fillStyle = g;
      ctx.fillRect(e.x - r * 4, e.y - r * 4, r * 8, r * 8);
      ctx.fillStyle = rgba('#ffffff', a * 0.6);
      ctx.beginPath();
      ctx.arc(e.x, e.y, r * 0.5, 0, Math.PI * 2);
      ctx.fill();
      e.spark = false;
    }
    if (Math.random() < 0.015) {
      const bx = Math.random() * W;
      for (let i = 0; i < 5; i++) {
        const e = makeEmber();
        e.x = bx + (Math.random() - 0.5) * 40;
        e.y = H - 10;
        e.vy *= 1.5;
        embers.push(e);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  draw();
  return () => cancelAnimationFrame(animId);
}

// ===== SELECCIONAR UNO AL AZAR =====
const effects = [
  { name: 'Synapse', fn: initSynapse },
  { name: 'Rain', fn: initRain },
  { name: 'Constellations', fn: initConstellations },
  { name: 'Perlin Flow', fn: initPerlinFlow },
  { name: 'Petals', fn: initPetals },
  { name: 'Sparkles', fn: initSparkles },
  { name: 'Embers', fn: initEmbers },
];

const chosen = effects[Math.floor(Math.random() * effects.length)];
document.getElementById('effect-name').textContent = '✨ ' + chosen.name;
console.log('🎨 Efecto:', chosen.name);
chosen.fn();
</script>
</body>
</html>
